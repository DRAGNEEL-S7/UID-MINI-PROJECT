<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Your Event | EventEase</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="container">
    <img src="parttyy2.jpeg" class="logo" >
    <div class="form-box">
        <h1>Register Your Event 🎉</h1>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="Event Title" required>
            <input type="text" placeholder="Location" required>
            <input type="date" required>
            <textarea placeholder="Event Description" required></textarea>
            <button type="submit">Submit Event</button>
        </form>
    </div>
</div>

</body>
</html>
